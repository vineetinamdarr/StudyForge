    // Use local calendar dates for day keys; toISOString() uses UTC and can shift dates.
    const localDateKey = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getWeekStartKey = (date) => {
      const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      return localDateKey(monday);
    };

    const safeSaveState = (key, value) => {

        return false;
      }

    const getHabitStreak = (days, todayIndex) => {
      if (!Array.isArray(days) || days.length !== 7) return 0;
      // If today is not checked yet, continue counting from yesterday.
      let index = days[todayIndex] ? todayIndex : (todayIndex + 6) % 7;
      let streak = 0;
      for (let i = 0; i < 7; i += 1) {
        if (!days[index]) break;
        streak += 1;
        index = (index + 6) % 7;
      }
      return streak;
    };

    // Helper to safely mount Lucide icons in UMD/browser environment
    const createLucideIcon = (iconName) => {
      return function LucideReactIcon({ className = 'w-4 h-4', ...props }) {
        const raw =
          window.lucide &&
          (window.lucide[iconName] || (window.lucide.icons && window.lucide.icons[iconName]));
        if (!raw) {
          return <span className={`inline-block ${className}`} {...props} />;
        }
        const children =
          raw[0] === 'svg' && Array.isArray(raw[2])
            ? raw[2]
            : Array.isArray(raw)
            ? raw
            : [];
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            {...props}
          >
            {children.map((child, idx) => {
              if (!Array.isArray(child)) return null;
              const [Tag, attrs] = child;
              return React.createElement(Tag, { key: idx, ...attrs });
            })}
          </svg>
        );
      };
    };

      const formatStopwatch = (totalSeconds) => {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        return {
          hrs: String(hrs).padStart(2, '0'),
          mins: String(mins).padStart(2, '0'),
          secs: String(secs).padStart(2, '0'),
          formatted: `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
        };
      };

      const formatHoursReadable = (totalSeconds) => {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        if (h > 0) return `${h}h ${m}m`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
      };

      const handleLogStopwatchSession = () => {
        if (stopwatchSecs < 60) {
          triggerToast('Study for at least 1 minute before logging a session.', 'sparkles');
          return;
        }
        setStopwatchRunning(false);
        const todayKey = localDateKey(now);
        const timeStampStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const earnedXp = Math.max(2, Math.floor(stopwatchSecs / 60) * 2);

        setStudyHistory((prev) => {
          const existingDay = prev[todayKey] || { totalSeconds: 0, sessions: [] };
          const newSession = {
            id: `sw-${Date.now()}`,
            subject: stopwatchSubject,
            durationSecs: stopwatchSecs,
            timestamp: timeStampStr
          };
          return {
            ...prev,
            [todayKey]: {
              totalSeconds: existingDay.totalSeconds + stopwatchSecs,
              sessions: [newSession, ...existingDay.sessions]
            }
          };
        });

        const loggedTime = formatHoursReadable(stopwatchSecs);
        setStopwatchSecs(0);
        setXp((x) => x + earnedXp);
        playCompletionChime();
        triggerToast(`Logged ${loggedTime} of ${stopwatchSubject}! (+${earnedXp} XP)`, 'trophy');
      };

      const deleteStudyDayEntry = (dateKey, sessionId, durationSecs) => {
        setStudyHistory((prev) => {
          const dayData = prev[dateKey];
          if (!dayData) return prev;
          const updatedSessions = dayData.sessions.filter((s) => s.id !== sessionId);
          const updatedTotal = Math.max(0, dayData.totalSeconds - durationSecs);
          const next = { ...prev };
          if (updatedSessions.length === 0) {
            delete next[dateKey];
          } else {
            next[dateKey] = { totalSeconds: updatedTotal, sessions: updatedSessions };
          }
          return next;
        });
        triggerToast('Session removed from study log', 'check');
      };

      const stopAmbientAudio = () => {
        activeNodesRef.current.forEach((node) => {
          try {
            if (node.stop) node.stop();
            if (node.disconnect) node.disconnect();
          } catch (e) {}
        });
        activeNodesRef.current = [];
      };

      const playCompletionChime = () => {
        try {
          const ctx = audioCtxRef.current || new (window.AudioContext || window.webkitAudioContext)();
          audioCtxRef.current = ctx;
          if (ctx.state === 'suspended') ctx.resume();

          const notesFreq = [523.25, 659.25, 783.99, 1046.5];
          notesFreq.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.14 + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.14);
            osc.stop(ctx.currentTime + idx * 0.14 + 0.85);
          });
        } catch (e) {}
      };

      const startAmbientAudio = (type, vol) => {
        stopAmbientAudio();
        if (type === 'off') return;

        try {
          const ctx = audioCtxRef.current || new (window.AudioContext || window.webkitAudioContext)();
          audioCtxRef.current = ctx;
          if (ctx.state === 'suspended') ctx.resume();

          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(vol, ctx.currentTime);
          masterGain.connect(ctx.destination);

          if (type === 'rain') {
            const bufferSize = 2 * ctx.sampleRate;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              output[i] = (lastOut + 0.02 * white) / 1.02;
              lastOut = output[i];
              output[i] *= 2.5;
            }
            const whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(850, ctx.currentTime);

            whiteNoise.connect(filter);
            filter.connect(masterGain);
            whiteNoise.start(0);
            activeNodesRef.current = [whiteNoise, filter, masterGain];
          } else if (type === 'lofi') {
            const freqs = [174.61, 220.0, 261.63, 329.63];
            const nodes = [masterGain];
            freqs.forEach((f) => {
              const osc = ctx.createOscillator();
              const oscGain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, ctx.currentTime);
              oscGain.gain.setValueAtTime(0.18, ctx.currentTime);

              const filter = ctx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(420, ctx.currentTime);

              osc.connect(filter);
              filter.connect(oscGain);
              oscGain.connect(masterGain);
              osc.start();
              nodes.push(osc, filter, oscGain);
            });
            activeNodesRef.current = nodes;
          } else if (type === 'binaural') {
            const oscLeft = ctx.createOscillator();
            const oscRight = ctx.createOscillator();
            const gainNodes = ctx.createGain();
            gainNodes.gain.setValueAtTime(0.35, ctx.currentTime);

            oscLeft.type = 'sine';
            oscRight.type = 'sine';
            oscLeft.frequency.setValueAtTime(200, ctx.currentTime);
            oscRight.frequency.setValueAtTime(214, ctx.currentTime);

            oscLeft.connect(gainNodes);
            oscRight.connect(gainNodes);
            gainNodes.connect(masterGain);
            oscLeft.start();
            oscRight.start();
            activeNodesRef.current = [oscLeft, oscRight, gainNodes, masterGain];
          }
        } catch (e) {}
      };

      useEffect(() => {
        startAmbientAudio(ambientType, volume);
        return () => stopAmbientAudio();
      }, [ambientType, volume]);

      useEffect(() => {
        if (!isRunning) return;
        const interval = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(interval);
              setIsRunning(false);
              playCompletionChime();
              const minsCompleted = Math.max(1, Math.round(totalTime / 60));
              setFocusStats((st) => ({
                sessionsCompleted: st.sessionsCompleted + 1,
                totalMinutes: st.totalMinutes + minsCompleted
              }));
              const earnedXp = Math.max(2, Math.round(minsCompleted * 2));
              setXp((x) => x + earnedXp);
              triggerToast(`Focus session complete (${selectedMode.label})! +${earnedXp} XP & ${minsCompleted}m logged`, 'trophy');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isRunning, totalTime, selectedMode]);

      const selectTimerMode = (mode) => {
        setIsRunning(false);
        setSelectedMode(mode);
        setCustomMinutes(mode.minutes);
        setTimeLeft(mode.minutes * 60);
        setTotalTime(mode.minutes * 60);
      };

      const applyCustomMinutes = (mins) => {
        const valid = Math.min(180, Math.max(1, Number(mins) || 1));
        setCustomMinutes(valid);
        setIsRunning(false);
        setTimeLeft(valid * 60);
        setTotalTime(valid * 60);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      const timerProgress = totalTime > 0 ? ((totalTime - timeLeft) / totalTime) * 100 : 0;

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const newTask = {
          id: `t-${Date.now()}`,
          title: newTaskTitle.trim(),
          category: newTaskCategory,
          priority: newTaskPriority,
          status: 'todo',
          xp: newTaskPriority === 'High' ? 50 : newTaskPriority === 'Medium' ? 35 : 25

        setTasks([newTask, ...tasks]);
        setNewTaskTitle('');
        setShowAddTask(false);
        triggerToast('New task added to board!', 'check');
      };

      const moveTask = (taskId, newStatus) => {
        setTasks((prev) =>
          prev.map((t) => {
            if (t.id === taskId) {
              const shouldAwardXp = newStatus === 'completed' && t.status !== 'completed' && !t.xpAwarded;
              if (shouldAwardXp) {
                setXp((x) => x + (Number(t.xp) || 0));
                triggerToast(`Task Completed! +${Number(t.xp) || 0} XP earned`, 'zap');
              }
              return { ...t, status: newStatus, xpAwarded: Boolean(t.xpAwarded || shouldAwardXp) };
            }
            return t;
          })
        );
      };

      const deleteTask = (taskId) => {
        setTasks((prev) => prev.filter((t) => t.id !== taskId));
      };

      const filteredTasks = useMemo(() => {
        if (taskFilter === 'All') return tasks;
        return tasks.filter((t) => t.category === taskFilter);
      }, [tasks, taskFilter]);

      const toggleHabitDay = (habitId, dayIdx) => {
        setHabits((prev) =>
          prev.map((h) => {
            if (h.id !== habitId) return h;
            const updatedDays = [...(Array.isArray(h.days) ? h.days : Array(7).fill(false))];
            const earnedDays = Array.isArray(h.earnedDays) ? [...h.earnedDays] : [];
            updatedDays[dayIdx] = !updatedDays[dayIdx];
            const todayKey = localDateKey(new Date());
            const shouldAwardXp = updatedDays[dayIdx] && !earnedDays.includes(todayKey);
            if (shouldAwardXp) {
              earnedDays.push(todayKey);
              setXp((x) => x + 20);
              triggerToast('Habit checked! +20 XP earned today', 'flame');
            }
            const todayIndex = (new Date().getDay() + 6) % 7;
            return { ...h, days: updatedDays, earnedDays, streak: getHabitStreak(updatedDays, todayIndex) };
          })
        );
      };

      const handleExportData = () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          xp,
          focusStats,
          categories,
          tasks,
          habits,
          noteTabs,
          notes,
          studyHistory

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dev-command-center-backup.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Give the browser time to start the download before revoking its URL.
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        triggerToast('Workspace JSON exported!', 'download');
      };

      const handleResetDemo = () => {
        const confirmed = window.confirm('Reset this workspace? Your saved tasks, notes, habits, XP, and study history on this browser will be replaced with a clean starter workspace. Export a backup first if you need it.');
        if (!confirmed) return;
        setXp(0);
        setCategories(INITIAL_CATEGORIES);
        setTasks([]);
        setHabits(INITIAL_HABITS);
        setNoteTabs(INITIAL_NOTE_TABS);

        setActiveNoteTab(INITIAL_NOTE_TABS[0].id);
        setFocusStats({ sessionsCompleted: 0, totalMinutes: 0 });
        setStudyHistory({});
        setStopwatchSecs(0);
        setStopwatchRunning(false);
        triggerToast('Workspace reset to a clean starter state', 'refresh');
      };

      const copyScratchpad = async () => {
        const textToCopy = notes[activeNoteTab] || '';

          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(textToCopy);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            const copied = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (!copied) throw new Error('Clipboard copy was blocked');
          }
          setCopiedNote(true);
          setTimeout(() => setCopiedNote(false), 1800);
          triggerToast('Scratchpad copied to clipboard', 'check');
        } catch (error) {
          triggerToast('Copy was blocked by the browser. Select the text and copy it manually.', 'sparkles');
        }
      };

      const currentLevel = Math.floor(xp / 100) + 1;
      const xpInCurrentLevel = xp % 100;
      const totalStreak = habits.reduce((acc, h) => acc + h.streak, 0);

      return (
        <div className="min-h-screen bg-[#0b0f19] text-slate-100 flex flex-col lg:flex-row font-sans selection:bg-indigo-500 selection:text-white overflow-x-hidden">
          {/* Ambient Glows */}
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl" />
            <div className="absolute top-1/3 -right-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl" />
            <div className="absolute -bottom-32 left-1/3 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl" />
          </div>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-900/95 border border-indigo-500/40 shadow-2xl shadow-indigo-500/20 backdrop-blur-md animate-bounce">
              <Sparkles className="w-5 h-5 text-indigo-400 shrink-0" />
              <span className="text-sm font-medium text-slate-100">{toast.message}</span>
            </div>
          )}

          {/* Sidebar */}
          <aside className="relative z-10 w-full lg:w-64 bg-slate-900/60 backdrop-blur-xl border-b lg:border-b-0 lg:border-r border-slate-800/80 flex flex-col justify-between shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800/80 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-cyan-500 to-emerald-400 p-[1px] shadow-lg shadow-indigo-500/20">
                    <div className="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center">
                      <Terminal className="w-5 h-5 text-cyan-400" />
                    </div>
                  </div>
                  <div>
                    <h1 className="font-bold text-base tracking-tight text-white flex items-center gap-1.5">
                      StudyForge
                    </h1>
                    <p className="text-xs text-slate-400">Focus. Build. Learn.</p>
                  </div>
                </div>
              </div>

              <nav className="p-3 flex lg:flex-col gap-1.5 overflow-x-auto">
                {[
                  { id: 'dashboard', label: 'Command Grid', icon: LayoutGrid, badge: 'All' },
                  { id: 'zen_clock', label: 'Zen Clock & Timewatch', icon: Watch, badge: stopwatchRunning ? formatStopwatch(stopwatchSecs).formatted : 'Live' },
                  { id: 'focus', label: 'Focus & Synth', icon: Clock, badge: formatTime(timeLeft) },
                  { id: 'kanban', label: 'Kanban Board', icon: Layers, badge: tasks.filter(t => t.status !== 'completed').length },
                  { id: 'scratchpad', label: 'Dev Scratchpad', icon: Code2, badge: 'Code' }
                ].map((item) => {
                  const Icon = item.icon;
                  const active = activeNav === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveNav(item.id)}
                      className={`flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all shrink-0 ${
                        active
                          ? 'bg-gradient-to-r from-indigo-600/30 to-cyan-500/20 text-white border border-indigo-500/40 shadow-lg shadow-indigo-500/10'
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <Icon className={`w-4 h-4 ${active ? 'text-cyan-400' : 'text-slate-400'}`} />
                        <span>{item.label}</span>
                      </div>
                      <span className={`text-[11px] font-mono px-1.5 py-0.5 rounded-md ${
                        active ? 'bg-indigo-500/30 text-cyan-300' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {item.badge}
                      </span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="hidden lg:block p-4 m-3 rounded-2xl bg-slate-950/80 border border-slate-800/90">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-medium text-slate-400 flex items-center gap-1.5">

                </span>
                <button

                  <Settings className="w-3 h-3" /> Manage

              <div className="flex flex-wrap gap-1.5 mt-2">

          {/* Main Area */}

              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-lg sm:text-xl font-bold text-white tracking-tight">
                    StudyForge
                  </h2>
                  <span className="hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-medium">
                    <Sparkles className="w-3 h-3" /> Sem 1 CSE
                  </span>

                  {now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}

              <div className="flex flex-wrap items-center gap-3">
                <button

            {/* CATEGORY MANAGER MODAL */}
            {showCategoryManager && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-5">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div className="flex items-center gap-2">

                      <h3 className="font-bold text-base text-white">Manage Categories</h3>
                    </div>
                    <button
                      onClick={() => setShowCategoryManager(false)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800 transition"

                  <form onSubmit={handleAddCategory} className="space-y-3">

                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Badge Color Palette</label>
                      <select
                        value={newCatColor}
                        onChange={(e) => setNewCatColor(e.target.value)}

                      >
                        {COLOR_PALETTES.map((pal) => (
                          <option key={pal.label} value={pal.value}>
                            {pal.label}
                          </option>
                        ))}
                      </select>
                    </div>
                    <button
                      type="submit"

                    >
                      + Add Category
                    </button>
                  </form>

                  <div className="space-y-2 pt-2 border-t border-slate-800">
                    <span className="text-xs font-mono uppercase tracking-wider text-slate-400">Existing Categories</span>
                    <div className="max-h-48 overflow-y-auto space-y-2 pr-1">
                      {categories.map((cat) => (
                        <div
                          key={cat.id}

                          <div className="flex items-center gap-2">
                            {ambientType === 'off' ? (
                              <VolumeX className="w-3.5 h-3.5 text-slate-500" />
                            ) : (
                              <Volume2 className="w-3.5 h-3.5 text-cyan-400 animate-pulse" />
                            )}
                            <input
                              type="range" min="0.02" max="0.6" step="0.02" value={volume}
                              onChange={(e) => setVolume(parseFloat(e.target.value))}
                              className="w-20 accent-cyan-400 cursor-pointer h-1 bg-slate-800 rounded-lg"
                            />
                          </div>
                        </div>
                        <div className="grid grid-cols-4 gap-1.5">
                          {[
                            { id: 'off', label: 'Muted' },
                            { id: 'rain', label: 'Soft Rain' },
                            { id: 'lofi', label: 'Warm Pad' },
                            { id: 'binaural', label: 'Beta 14Hz' }
                          ].map((sound) => (
                            <button
                              key={sound.id}
                              onClick={() => setAmbientType(sound.id)}
                              className={`py-1.5 px-2 rounded-lg text-xs font-medium border transition ${
                                ambientType === sound.id
                                  ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300'
                                  : 'bg-slate-950/60 border-slate-800 text-slate-400 hover:text-slate-200'
                              }`}
                            >
                              {sound.label}
                            </button>
                          ))}
                        </div>
                      </div>
                    </section>
                  )}

                  {(activeNav === 'dashboard' || activeNav === 'kanban') && (
                    <section
                      className={`${
                        activeNav === 'kanban' ? 'xl:col-span-12' : 'xl:col-span-7'
                      } bg-slate-900/50 backdrop-blur-xl border border-slate-800/90 rounded-2xl p-5 flex flex-col shadow-xl`}
                    >
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-2">
                          <Layers className="w-5 h-5 text-indigo-400" />
                          <h3 className="font-bold text-base text-white">Sprint Kanban Board</h3>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <select
                            value={taskFilter}
                            onChange={(e) => setTaskFilter(e.target.value)}
                            className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500"
                          >
                            <option value="All">All Categories</option>
                            {categories.map(c => (
                              <option key={c.id} value={c.name}>{c.name}</option>
                            ))}
                          </select>

                          <button
                            onClick={() => setShowAddTask(!showAddTask)}
                            className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-indigo-600/20"
                          >
                            <Plus className="w-3.5 h-3.5" /> New Task
                          </button>
                        </div>
                      </div>

                      {showAddTask && (
                        <form
                          onSubmit={handleAddTask}
                          className="mb-4 p-3.5 rounded-xl bg-slate-950/90 border border-indigo-500/30 grid grid-cols-1 sm:grid-cols-12 gap-2.5"
                        >
                          <input
                            type="text"
                            placeholder="e.g., Implement Linked List..."
                            value={newTaskTitle}
                            onChange={(e) => setNewTaskTitle(e.target.value)}
                            className="sm:col-span-6 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                          />
                          <select
                            value={newTaskCategory}
                            onChange={(e) => setNewTaskCategory(e.target.value)}
                            className="sm:col-span-3 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-xs text-slate-200"
                          >
                            {categories.map(c => (
                              <option key={c.id} value={c.name}>{c.name}</option>
                            ))}
                          </select>
                          <select
                            value={newTaskPriority}
                            onChange={(e) => setNewTaskPriority(e.target.value)}
                            className="sm:col-span-2 bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-xs text-slate-200"
                          >
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                          </select>
                          <button
                            type="submit"
                            className="sm:col-span-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg py-2 text-xs transition"
                          >
                            Add
                          </button>
                        </form>
                      )}

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5 flex-1">
                        {[
                          { id: 'todo', title: 'To Do', dot: 'bg-slate-400' },
                          { id: 'in_progress', title: 'In Progress', dot: 'bg-cyan-400' },
                          { id: 'completed', title: 'Completed', dot: 'bg-emerald-400' }
                        ].map((col) => {
                          const colTasks = filteredTasks.filter((t) => t.status === col.id);
                          return (
                            <div
                              key={col.id}
                              className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex flex-col justify-between min-h-[260px]"
                            >
                              <div>
                                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/80">
                                  <div className="flex items-center gap-2">
                                    <span className={`w-2 h-2 rounded-full ${col.dot}`} />
                                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-300">
                                      {col.title}
                                    </h4>
                                  </div>
                                  <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-slate-900 text-slate-400">
                                    {colTasks.length}
                                  </span>
                                </div>

                                <div className="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
                                  {colTasks.length === 0 ? (
                                    <p className="text-xs text-slate-600 text-center py-8 italic">
                                      No tasks
                                    </p>
                                  ) : (
                                    colTasks.map((task) => (
                                      <div
                                        key={task.id}
                                        className="p-3 rounded-xl bg-slate-900/90 border border-slate-800/90 hover:border-slate-700 transition group"
                                      >
                                        <div className="flex items-center justify-between gap-1 mb-1.5">
                                          <span className={`text-[10px] font-medium px-2 py-0.5 rounded-md border ${categoryStylesMap[task.category] || 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                            {task.category}
                                          </span>
                                          <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${PRIORITY_STYLES[task.priority]}`}>
                                            {task.priority}
                                          </span>
                                        </div>

                                        <p className={`text-xs font-medium leading-relaxed mb-3 ${task.status === 'completed' ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                          {task.title}
                                        </p>

                                        <div className="flex items-center justify-between pt-2 border-t border-slate-800/60">
                                          <span className="text-[10px] font-mono text-indigo-400">
                                            +{task.xp} XP
                                          </span>
                                          <div className="flex items-center gap-1">
                                            {task.status !== 'todo' && (
                                              <button
                                                onClick={() => moveTask(task.id, task.status === 'completed' ? 'in_progress' : 'todo')}
                                                className="p-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300"
                                              >
                                                <ArrowLeft className="w-3 h-3" />
                                              </button>
                                            )}
                                            {task.status !== 'completed' && (
                                              <button
                                                onClick={() => moveTask(task.id, task.status === 'todo' ? 'in_progress' : 'completed')}
                                                className="p-1 rounded bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300"
                                              >
                                                <ArrowRight className="w-3 h-3" />
                                              </button>
                                            )}
                                            <button
                                              onClick={() => deleteTask(task.id)}
                                              className="p-1 rounded hover:bg-red-500/20 text-slate-500 hover:text-red-400 transition"
                                            >
                                              <Trash2 className="w-3 h-3" />
                                            </button>
                                          </div>
                                        </div>
                                      </div>
                                    ))
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  )}
                </div>
              )}

              {/* HABITS + SCRATCHPAD */}
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                {activeNav === 'dashboard' && (
                  <section className="xl:col-span-5 bg-slate-900/50 backdrop-blur-xl border border-slate-800/90 rounded-2xl p-5 flex flex-col justify-between shadow-xl">
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-2">
                          <Flame className="w-5 h-5 text-amber-400" />
                          <h3 className="font-bold text-base text-white">Daily Habit Matrix</h3>
                        </div>
                        <span className="text-xs font-mono text-amber-300">+20 XP</span>
                      </div>

                      <div className="space-y-3.5">
                        {habits.map((habit) => (
                          <div key={habit.id} className="p-3 rounded-xl bg-slate-950/70 border border-slate-800/80">
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-xs font-medium text-slate-200 truncate pr-2">{habit.name}</span>
                              <span className="text-[11px] font-mono text-amber-400 shrink-0 flex items-center gap-0.5">
                                <Flame className="w-3 h-3" /> {habit.streak}d
                              </span>
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                              {DAYS_SHORT.map((dayLabel, idx) => {
                                const done = habit.days[idx];
                                return (
                                  <button
                                    key={dayLabel}
                                    onClick={() => toggleHabitDay(habit.id, idx)}
                                    className={`py-1.5 rounded-lg text-[10px] font-mono font-semibold border transition flex flex-col items-center ${
                                      done
                                        ? 'bg-emerald-500/25 border-emerald-500/50 text-emerald-300'
                                        : 'bg-slate-900 border-slate-800 text-slate-500 hover:text-slate-300'
                                    }`}
                                  >
                                    <span>{dayLabel[0]}</span>
                                    <span className="mt-0.5">{done ? '✓' : '·'}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                )}

                {(activeNav === 'dashboard' || activeNav === 'scratchpad') && (
                  <section
                    className={`${
                      activeNav === 'scratchpad' ? 'xl:col-span-12 max-w-5xl mx-auto w-full' : 'xl:col-span-7'
                    } bg-slate-900/50 backdrop-blur-xl border border-slate-800/90 rounded-2xl p-5 flex flex-col justify-between shadow-xl`}
                  >
                    <div className="flex flex-col h-full">
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div className="flex items-center gap-2">
                          <Code2 className="w-5 h-5 text-emerald-400" />
                          <h3 className="font-bold text-base text-white">Dev Scratchpad</h3>
                        </div>

                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={copyScratchpad}
                            className="px-2.5 py-1 rounded-lg bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs flex items-center gap-1.5 transition"
                          >
                            {copiedNote ? <><Check className="w-3.5 h-3.5 text-emerald-400" /> Copied</> : <><Copy className="w-3.5 h-3.5 text-cyan-400" /> Copy</>}
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-wrap items-center gap-1.5 mb-3">
                        {noteTabs.map((tab) => (
                          <div
                            key={tab.id}
                            onClick={() => setActiveNoteTab(tab.id)}
                            className={`group cursor-pointer pl-3 pr-2 py-1.5 rounded-xl text-xs font-medium border transition flex items-center gap-1.5 ${
                              activeNoteTab === tab.id
                                ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                                : 'bg-slate-950/60 text-slate-400 border-slate-800 hover:text-slate-200'
                            }`}
                          >
                            <span>{tab.label}</span>
                            {noteTabs.length > 1 && (
                              <button
                                type="button"
                                onClick={(e) => handleDeleteNoteTab(e, tab.id, tab.label)}
                                title={`Remove ${tab.label}`}
                                className={`p-0.5 rounded-md transition ${
                                  activeNoteTab === tab.id
                                    ? 'text-emerald-300/70 hover:text-red-300 hover:bg-red-500/20'
                                    : 'text-slate-500 opacity-60 group-hover:opacity-100 hover:text-red-400 hover:bg-red-500/15'
                                }`}
                              >
                                <X className="w-3 h-3" />
                              </button>
                            )}
                          </div>
                        ))}

                        {!showAddNoteTab ? (
                          <button
                            type="button"
                            onClick={() => setShowAddNoteTab(true)}
                            className="px-2.5 py-1.5 rounded-xl text-xs font-medium border border-dashed border-slate-700 hover:border-emerald-500/50 text-slate-400 hover:text-emerald-300 bg-slate-950/40 transition flex items-center gap-1"
                            title="Add new section/topic"
                          >
                            <Plus className="w-3.5 h-3.5" />
                            <span>Add Topic</span>
                          </button>
                        ) : (
                          <form onSubmit={handleAddNoteTab} className="flex items-center gap-1">
                            <input
                              type="text"
                              autoFocus
                              placeholder="Topic name..."
                              value={newNoteTabTitle}
                              onChange={(e) => setNewNoteTabTitle(e.target.value)}
                              className="bg-slate-950 border border-emerald-500/50 rounded-xl px-2.5 py-1 text-xs text-white focus:outline-none w-32"
                            />
                            <button
                              type="submit"
                              className="px-2.5 py-1 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition"
                            >
                              Add
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                setShowAddNoteTab(false);
                                setNewNoteTabTitle('');
                              }}
                              className="p-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition"
                            >
                              <X className="w-3.5 h-3.5" />
                            </button>
                          </form>
                        )}
                      </div>

                      <textarea
                        value={notes[activeNoteTab] || ''}
                        onChange={(e) => setNotes({ ...notes, [activeNoteTab]: e.target.value })}
                        rows={activeNav === 'scratchpad' ? 16 : 9}
                        spellCheck={false}
                        placeholder="Write code snippets, study notes, or ideas for this topic..."
                        className="w-full flex-1 bg-slate-950/90 border border-slate-800 rounded-xl p-3.5 text-xs font-mono text-slate-200 leading-relaxed focus:outline-none focus:border-emerald-500/50 resize-none"
                      />

                      <div className="flex items-center justify-between text-[11px] font-mono text-slate-500 mt-2 pt-1">
                        <span title="Saved only in this browser profile; use Export for a backup">Auto-saved on this device · Export for backup</span>
                        <span>{(notes[activeNoteTab] || '').split('\n').length} lines</span>
                      </div>
                    </div>
                  </section>
                )}
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
